<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Link Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<script>
if (localStorage.getItem("admin") !== "true") {
    location.href = "admin-login.html";
}
</script>

<div class="admin-container">

    <!-- サイドバー -->
    <aside class="sidebar">

        <div class="logo">

    <img src="../images/logo.png" alt="Study Link" class="admin-logo">

    <p>Admin Panel</p>

</div>

        <button class="menu-btn active" onclick="showPage('dashboard', this)">
            📊 ダッシュボード
        </button>

        <button class="menu-btn" onclick="showPage('notice', this)">
            📢 お知らせ
        </button>

        <button class="menu-btn" onclick="showPage('calendar', this)">
            📅 カレンダー
        </button>

        <button class="menu-btn" onclick="showPage('post', this)">
            📝 投稿管理
        </button>

        <button class="menu-btn" onclick="showPage('settings', this)">
            ⚙️ 設定
        </button>

        <button id="logout" class="logout-btn">
            🚪 ログアウト
        </button>

    </aside>

    <!-- メイン -->
    <main class="main-content">

        <!-- ダッシュボード -->
        <section id="dashboardPage" class="page">

            <h1>📊 ダッシュボード</h1>

            <div class="cards">

                <div class="card">
                    <h3>📝 投稿数</h3>
                    <p id="postCount">--</p>
                </div>

                <div class="card">
                    <h3>📢 お知らせ</h3>
                    <p id="noticeCount">--</p>
                </div>

                <div class="card">
                    <h3>📅 予定</h3>
                    <p id="calendarCount">--</p>
                </div>

                <div class="card">
                    <h3>👥 ユーザー</h3>
                    <p>開発中</p>
                </div>

            </div>

        </section>

        <!-- お知らせ -->
<section id="noticePage" class="page" style="display:none;">

    <h1>📢 お知らせ管理</h1>

    <input
        type="text"
        id="noticeTitle"
        placeholder="タイトル">

    <textarea
        id="noticeContent"
        placeholder="内容を書いてください"></textarea>

    <button
        class="save-btn"
        id="noticeSubmit">
        📤 投稿する
    </button>

    <hr style="margin:30px 0;">

    <h2>登録済みのお知らせ</h2>

    <div id="noticeList">
        読み込み中...
    </div>

</section>

        <!-- カレンダー -->
        <section id="calendarPage" class="page" style="display:none;">

<h1>📅 カレンダー管理</h1>

<input
type="date"
id="calendarDate"
placeholder="日付">

<input
type="text"
id="calendarTitle"
placeholder="タイトル">

<textarea
id="calendarContent"
placeholder="内容を書いてください"></textarea>

<button
class="save-btn"
id="calendarSubmit">
📅 予定を追加
</button>

<hr style="margin:30px 0;">

<h2>登録済みの予定</h2>

<div id="calendarList">
読み込み中...
</div>

</section>

        <!-- 投稿 -->
        <section id="postPage" class="page" style="display:none;">

            <h1>📝 投稿管理</h1>

            <p>ここに投稿一覧を表示します。</p>

        </section>

        <!-- 設定 -->
        <section id="settingsPage" class="page" style="display:none;">

            <h1>⚙️ 設定</h1>

            <p>Study Link の設定画面です。</p>

        </section>

    </main>

</div>

<script src="admin.js"></script>

</body>
</html>
