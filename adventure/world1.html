<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WORLD1 - 正負の数の森</title>

<link rel="stylesheet" href="css/world1.css">

</head>

<body>

<div id="map">

    <img src="images/world1.png" id="mapImage">

    <div id="stageLayer">

    <button class="stage" id="stage1"> Stage1</button>

    <button class="stage" id="stage2"> Stage2</button>

    <button class="stage" id="stage3"> Stage3</button>

    <button class="stage" id="stage4"> Stage4</button>

    <button class="stage" id="stage5"> Stage5</button>

    <button class="stage boss" id="boss"> BOSS</button>

    <button class="stage extra" id="extra"> EXTRA</button>

</div>

</div>

<div id="stageInfo" class="hide">

    <h2 id="stageTitle"></h2>

    <p id="stageDescription"></p>

    <p id="questionCount"></p>

    <p id="clearCondition"></p>

    <p id="bestScore"></p>

    <button id="startBtn">
        ▶ START
    </button>

<script src="js/world1.js"></script>
