<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>メンテナンス中 - Study Link</title>

    <link
        rel="stylesheet"
        href="css/style.css?v=2"
    >

    <link
        rel="icon"
        href="images/logo2.png"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <style>

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #dbeafe
                );

        }

        .maintenance-card {

            width: calc(100% - 40px);

            max-width: 500px;

            box-sizing: border-box;

            background: #ffffff;

            border-radius: 20px;

            padding: 40px 25px;

            text-align: center;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.1);

        }

        .maintenance-logo {

            width: 90px;

            height: 90px;

            object-fit: contain;

            margin-bottom: 20px;

        }

        .maintenance-icon {

            font-size: 50px;

            margin-bottom: 10px;

        }

        .maintenance-card h1 {

            margin-bottom: 15px;

        }

        .maintenance-message {

            color: #555;

            line-height: 1.7;

        }

        .maintenance-end {

            margin-top: 20px;

            font-size: 14px;

            color: #777;

        }

    </style>

</head>

<body>

    <div class="maintenance-card">

        <img
            src="images/logo2.png"
            class="maintenance-logo"
            alt="Study Link"
        >

        <div class="maintenance-icon">
            🔧
        </div>

        <h1>
            メンテナンス中
        </h1>

        <p
            id="maintenanceMessage"
            class="maintenance-message"
        >
            現在StudyLinkはメンテナンス中です。
        </p>

        <p
            id="maintenanceEnd"
            class="maintenance-end"
        ></p>

    </div>

    <script>

    const API =
        "https://script.google.com/macros/s/AKfycbxdL1vYB2Iv6hpQOTDnvmBaIAChjsxXUvEIQdm9U-TM2hqBPeSGsrkVdJwLVNqN4Mcp/exec";

    async function loadMaintenance() {

        try {

            const response =
                await fetch(
                    API + "?type=maintenance"
                );

            const data =
                await response.json();

            if (
                data.result !== "success"
            ) {
                return;
            }

            // メンテナンス終了していたらホームへ
            if (!data.maintenance) {

                location.href =
                    "index.html";

                return;

            }

            const message =
                document.getElementById(
                    "maintenanceMessage"
                );

            if (message) {

                message.textContent =
                    data.message ||
                    "現在StudyLinkはメンテナンス中です。";

            }

            const end =
                document.getElementById(
                    "maintenanceEnd"
                );

            if (
                end &&
                data.endTime
            ) {

                const date =
                    new Date(
                        data.endTime
                    );

                if (!isNaN(date.getTime())) {

                    end.textContent =
                        "⏰ 終了予定：" +
                        date.toLocaleString(
                            "ja-JP",
                            {
                                year: "numeric",
                                month: "numeric",
                                day: "numeric",
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        );

                }

            }

        } catch (error) {

            console.error(
                "メンテナンス情報取得エラー:",
                error
            );

        }

    }

    loadMaintenance();

    </script>

    <script src="js/maintenance-check.js?v=1"></script>

</body>

</html>
