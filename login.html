<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Link ログイン</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>📚 Study Link</h1>

        <!-- ======================
             初回登録
        ======================= -->

        <div id="registerArea">

            <h2>🆕 初回登録</h2>

            <p>Study Linkをはじめて利用する方</p>

            <input
                type="text"
                id="registerName"
                placeholder="名前">

            <br><br>

            <input
                type="password"
                id="registerPassword"
                placeholder="パスワード">

            <br><br>

            <input
                type="password"
                id="registerPasswordConfirm"
                placeholder="パスワード（確認）">

            <br><br>

            <button id="registerBtn">
                🆕 登録する
            </button>

            <br><br>

            <button id="showLoginBtn">
                🔑 登録済みの方はこちら
            </button>

        </div>


        <!-- ======================
             ログイン
        ======================= -->

        <div id="loginArea" style="display:none;">

            <h2>🔑 ログイン</h2>

            <p>登録した名前とパスワードを入力してください</p>

            <input
                type="text"
                id="loginName"
                placeholder="名前">

            <br><br>

            <input
                type="password"
                id="loginPassword"
                placeholder="パスワード">

            <br><br>

            <button id="loginBtn">
                🔑 ログイン
            </button>

            <br><br>

            <button id="showRegisterBtn">
                🆕 新規登録はこちら
            </button>

        </div>

    </div>

</div>


<script src="js/login.js"></script>

</body>
</html>
