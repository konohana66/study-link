<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クラスノート</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <h1>📝 クラスノート</h1>

    <p>みんなで予定を書き込もう！</p>

</header>

<div class="container">

    <div class="card note-header">

    <h2>📚 ノート</h2>

    <div class="note-tabs">

        <button id="schoolTab" class="tab active">
            📚 学校
        </button>

        <button id="clubTab" class="tab">
            🏀 部活動
        </button>

    </div>

</div>

    <div class="card">

    <div class="post-top">

        <h2>📢 投稿一覧</h2>

        <button class="add-post">
            ➕ 投稿する
        </button>

    </div>

    <div id="postList"></div>

</div>

    <a href="index.html" class="back-button">
        🏠 ホームへ戻る
    </a>

</div>

<div id="popup" class="popup">

    <div class="popup-box">

        <h2>📝 新しい投稿</h2>

        <select id="category">

            <option value="school">📚 学校</option>
            <option value="club">🏀 部活動</option>

        </select>

        <input
            type="text"
            id="title"
            placeholder="タイトル"
        >

        <textarea
            id="content"
            placeholder="内容を書いてください"
        ></textarea>

        <input
    type="file"
    id="image"
    accept="image/*"
>

        <button
            class="submit-btn"
            id="submitBtn"
        >
            投稿する
        </button>

        <button class="close-btn">
            閉じる
        </button>

    </div>

</div>

<div id="imageViewer" class="image-viewer">
    <img id="viewerImage">
</div>

<script src="js/note.js"></script>

</body>
</html>
